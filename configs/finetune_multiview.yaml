data_file: data/
pretrain_ckpt: runs/pretrain_2d3d_pcqm4m/best.pt
out_dir: runs/
device: auto
seed: 42
epochs: 50
batch_size: 32
num_workers: 0
lr: 0.0001
weight_decay: 0.0
lambda_mvfr: 0.1
classification_loss: balanced_bce  
temperature: 0.1
finetune_1d_layers: 2
finetune_2d_layers: 2
max_steps: 0
model:
  
  smiles:
    model_name_or_path: DeepChem/ChemBERTa-77M-MLM
    proj_out_dim: 256
    pooling: mean
    max_len: 256
    fp16: false
  fingerprint:
    in_dim: 1048
    hidden: 256
    dropout: 0.1
  prediction_hidden: 256
  dropout: 0.1
  mvfr:
    hidden: 128
    heads: 4
    dropout: 0.1
perturbation:
  noise_std: 0.1
  noise_fraction: 0.5
  missing_probability: 0.5